<!-- Gallery with Lightbox -->
<div 
  x-data="{
    imageGalleryOpened: false,
    imageGalleryActiveUrl: null,
    imageGalleryImageIndex: null,
    touchStartX: 0,
    touchEndX: 0,
    touchStartY: 0,
    touchEndY: 0,
    
    imageGalleryOpen(event) {
        this.imageGalleryImageIndex = event.target.dataset.index;
        this.imageGalleryActiveUrl = event.target.src;
        this.imageGalleryOpened = true;
    },
    
    imageGalleryClose() {
        this.imageGalleryOpened = false;
        setTimeout(() => this.imageGalleryActiveUrl = null, 300);
    },
    
    imageGalleryNext(){
        if(this.imageGalleryImageIndex == this.$refs.gallery.childElementCount){
            this.imageGalleryImageIndex = 1;
        } else {
            this.imageGalleryImageIndex = parseInt(this.imageGalleryImageIndex) + 1;
        }
        this.imageGalleryActiveUrl = this.$refs.gallery.querySelector('[data-index=\'' + this.imageGalleryImageIndex + '\']').src;
    },
    
    imageGalleryPrev() {
        if(this.imageGalleryImageIndex == 1){
            this.imageGalleryImageIndex = this.$refs.gallery.childElementCount;
        } else {
            this.imageGalleryImageIndex = parseInt(this.imageGalleryImageIndex) - 1;
        }
        this.imageGalleryActiveUrl = this.$refs.gallery.querySelector('[data-index=\'' + this.imageGalleryImageIndex + '\']').src;
    },
    
    handleTouchStart(e) {
        this.touchStartX = e.changedTouches[0].screenX;
        this.touchStartY = e.changedTouches[0].screenY;
    },
    
    handleTouchEnd(e) {
        this.touchEndX = e.changedTouches[0].screenX;
        this.touchEndY = e.changedTouches[0].screenY;
        this.handleSwipe();
    },
    
    handleSwipe() {
        const deltaX = this.touchEndX - this.touchStartX;
        const deltaY = Math.abs(this.touchEndY - this.touchStartY);
        const minSwipeDistance = 50;
        
        // Only trigger if horizontal swipe is greater than vertical (prevent conflict with scroll)
        if (Math.abs(deltaX) > minSwipeDistance && Math.abs(deltaX) > deltaY) {
            if (deltaX > 0) {
                // Swipe right - go to previous image
                this.imageGalleryPrev();
            } else {
                // Swipe left - go to next image
                this.imageGalleryNext();
            }
        }
    }
  }" 
  @image-gallery-next.window="imageGalleryNext()" 
  @image-gallery-prev.window="imageGalleryPrev()" 
  @keyup.right.window="imageGalleryNext();" 
  @keyup.left.window="imageGalleryPrev();" 
  x-init="
    imageGalleryPhotos = $refs.gallery.querySelectorAll('img');
    for(let i=0; i<imageGalleryPhotos.length; i++){
        imageGalleryPhotos[i].setAttribute('data-index', i+1);
    }
  "
  class="w-full px-0 py-1 md:py-4 md:px-8 lg:py-10 lg:px-48"

  <!-- Lightbox Modal -->
  <template x-teleport="body">
        <div 
        x-show="imageGalleryOpened" 
        x-transition:enter="transition ease-in-out duration-300" 
        x-transition:enter-start="opacity-0" 
        x-transition:leave="transition ease-in-in duration-300" 
        x-transition:leave-end="opacity-0" 
        @click="imageGalleryClose"
        @touchstart="handleTouchStart($event)"
        @touchend="handleTouchEnd($event)" 
        @keydown.window.escape="imageGalleryClose" 
        x-effect="imageGalleryOpened ? document.body.style.overflow = 'hidden' : document.body.style.overflow = ''"
        @touchmove.prevent
        @gesturestart.prevent
        @gesturechange.prevent
        @wheel.prevent
        class="fixed inset-0 z-[99] flex items-center justify-center bg-black bg-opacity-90 select-none cursor-zoom-out touch-none" 
        x-cloak
      >
      <div class="relative flex items-center justify-center w-11/12 xl:w-4/5 h-11/12">
        
        <!-- Previous Button -->
        <div 
          @click="$event.stopPropagation(); $dispatch('image-gallery-prev')" 
          class="absolute left-0 flex items-center justify-center text-white translate-x-10 rounded-full cursor-pointer xl:-translate-x-24 2xl:-translate-x-32 bg-white/10 w-14 h-14 hover:bg-white/20"
        >

    <script defer>
      // Making let's talk button close if clicked anywhere outside 
      document.addEventListener("DOMContentLoaded", () => {
      const toggleBtn = document.getElementById("dropdownOffsetButton");
      const dropdown = document.getElementById("dropdownOffset");

      document.addEventListener("click", (e) => {
        // If click is *outside* both button + dropdown, close it
        if (!toggleBtn.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.add("hidden");
        }
      });
    });
    </script>
